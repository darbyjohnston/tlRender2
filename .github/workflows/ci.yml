name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs of the same workflow on the same branch
# when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        config: [Debug, Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compute the vcpkg submodule SHA so it can be folded into the
      # cache key.
      - name: Get vcpkg submodule SHA
        id: vcpkg-sha
        shell: bash
        run: |
          sha=$(git -C third_party/vcpkg rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Cache vcpkg's installed packages so we don't rebuild FFmpeg
      # from source on every CI run. The key includes the OS, the
      # contents of vcpkg.json (which lists dependencies), and the
      # vcpkg submodule SHA (which pins port versions). Any change
      # to dependencies or vcpkg itself invalidates the cache and
      # forces a rebuild.
      - name: Cache vcpkg installed packages
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/build/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ steps.vcpkg-sha.outputs.sha }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-

      # Linux-only: install build prerequisites that vcpkg's ffmpeg
      # port expects to find on the system. macOS and Windows runners
      # already have what's needed.
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            nasm \
            autoconf \
            automake \
            libtool \
            pkg-config \
            xorg-dev \
            libglu1-mesa-dev \
            mesa-common-dev \
            mesa-utils \
            xvfb

      - name: Configure
        run: cmake --preset default -DTL_BUILD_TESTS=ON -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Test
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.config }}

      - name: Install
        run: cmake --install build --config ${{ matrix.config }}

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: tlRender2-${{ matrix.os }}
          path: ${{ github.workspace }}/install
          retention-days: 7
